# ===============================
# DATABASE CONNECTION (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://postgres:5432/taskfodge_db
spring.datasource.username=taskfodge
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE CONFIG
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# HIKARI CONNECTION POOL
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ===============================
# REDIS CONNECTION
# ===============================
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=myStrongRedisPass
spring.data.redis.timeout=6000

# ===============================
# CACHE CONFIGURATION
# ===============================
spring.cache.type=redis
spring.cache.redis.time-to-live=300000          # TTL: 5 minutes
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=taskfodge::
spring.cache.redis.use-key-prefix=true

# ===============================
# LOGGING (optional)
# ===============================
logging.level.org.springframework=INFO
logging.level.org.example=DEBUG
logging.file.name=logs/taskfodge-app.log

# ===============================
# KAFKA CONFIGURATION
# ===============================
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=taskfodge-group
spring.kafka.consumer.auto-offset-reset=earliest

# ===============================
# RATE LIMITER CONFIGURATION
# ===============================
rate.limit.requests.per.minute=100
rate.limit.bucket.capacity=100
rate.limit.bucket.refill.period=PT1M
rate.limit.distributed=false

# ===============================
# SPRING ACTUATOR / MONITORING
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers,httptrace,env
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=TaskFodge
